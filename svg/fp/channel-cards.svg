</svg><text x="57" y="206" font-family="Liberation Sans, Arial, sans-serif" font-size="38" font-weight="bold" fill="#23265F">Meta &amp; LinkedIn ads</text><text x="57" y="264" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">An enterprise doesn't switch engineering</text><text x="57" y="309" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">partners because an ad caught a CTO mid-scroll.</text><text x="57" y="354" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">They switch when a system breaks and they</text><text x="57" y="399" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">search for a fix. These channels also need huge</text><text x="57" y="444" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">audiences, and 'CTOs evaluating Scala partners</text><text x="57" y="489" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">right now' is too small a slice to target.</text><rect x="973" y="20" width="925" height="585" rx="22" fill="white" stroke="#E2E3EE" stroke-width="2.5"/><g transform="translate(1017,62)" font-family="Liberation Sans, Arial, sans-serif" font-size="58" font-weight="bold"><text x="0" y="52" fill="#4285F4">S</text><text x="40" y="52" fill="#FBBC04">E</text><text x="78" y="52" fill="#EA4335">O</text></g><text x="1017" y="206" font-family="Liberation Sans, Arial, sans-serif" font-size="38" font-weight="bold" fill="#23265F">SEO</text><text x="1017" y="264" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">The right idea: show up at the moment of</text><text x="1017" y="309" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">search. But it takes 12+ months to rank, and</text><text x="1017" y="354" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">the first page of “scala development company”</text><text x="1017" y="399" font-family="Liberation Sans, Arial, sans-serif" font-size="32" fill="#4A4D68">results is already spoken for.</text><rect x="13" y="640" width="925" height="585" rx="22" fill="white" stroke="#E2E3EE" stroke-width="2.5"/><svg x="57" y="684" width="62" height="62" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet"><path d="M474.123 209.81c11.525-34.577 7.569-72.423-10.838-103.904-27.696-48.168-83.433-72.94-137.794-61.414a127.14 127.14 0 00-95.475-42.49c-55.564 0-104.936 35.781-122.139 88.593-35.781 7.397-66.574 29.76-84.637 61.414-27.868 48.167-21.503 108.72 15.826 150.007-11.525 34.578-7.569 72.424 10.838 103.733 27.696 48.34 83.433 73.111 137.966 61.585 24.084 27.18 58.833 42.835 95.303 42.663 55.564 0 104.936-35.782 122.139-88.594 35.782-7.397 66.574-29.76 84.465-61.413 28.04-48.168 21.676-108.722-15.654-150.008v-.172zm-39.567-87.218c11.01 19.267 15.139 41.803 11.354 63.65-.688-.516-2.064-1.204-2.924-1.72l-101.152-58.49a16.965 16.965 0 00-16.687 0L206.621 194.5v-50.232l97.883-56.597c45.587-26.32 103.732-10.666 130.052 34.921zm-227.935 104.42l49.888-28.9 49.887 28.9v57.63l-49.887 28.9-49.888-28.9v-57.63zm23.223-191.81c22.364 0 43.867 7.742 61.07 22.02-.688.344-2.064 1.204-3.097 1.72L186.666 117.26c-5.161 2.925-8.258 8.43-8.258 14.45v136.934l-43.523-25.116V130.333c0-52.64 42.491-95.13 95.131-95.302l-.172.172zM52.14 168.697c11.182-19.268 28.557-34.062 49.544-41.803V247.14c0 6.02 3.097 11.354 8.258 14.45l118.354 68.295-43.695 25.288-97.711-56.425c-45.415-26.32-61.07-84.465-34.75-130.052zm26.665 220.71c-11.182-19.095-15.139-41.802-11.354-63.65.688.516 2.064 1.204 2.924 1.72l101.152 58.49a16.965 16.965 0 0016.687 0l118.354-68.467v50.232l-97.883 56.425c-45.587 26.148-103.732 10.665-130.052-34.75h.172zm204.54 87.39c-22.192 0-43.867-7.741-60.898-22.02a62.439 62.439 0 003.097-1.72l101.152-58.317c5.16-2.924 8.429-8.43 8.257-14.45V243.527l43.523 25.116v113.022c0 52.64-42.663 95.303-95.131 95.303v-.172zM461.22 343.303c-11.182 19.267-28.729 34.061-4