name: Render assets

on:
  push:
    paths:
      - "scripts/**"
      - "params/**"
      - "logos/**"
      - ".github/workflows/render.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          pip install --quiet cairosvg

      - name: Render all prospects
        run: |
          for p in params/*.json; do
            python3 scripts/render.py "$p"
          done

      - name: Commit rendered assets
        run: |
          git config user.name "render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add svg png
          git diff --cached --quiet || git commit -m "Render assets [skip ci]"
          git push
